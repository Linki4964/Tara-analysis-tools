# 提交前拦截硬编码密钥（API Key / Token / 私钥等）
#
# 前置依赖：gitleaks 需要能在 PATH 上被找到
#   winget install Gitleaks.Gitleaks
# 首次配置后执行一次：
#   pre-commit install
#
# 【为什么用 repo: local 而不是官方的 gitleaks-system】
# 上游 v8.30.1 tag 的 .pre-commit-hooks.yaml 里，gitleaks-system 这一条
# 漏写了 `pass_filenames: false`（同 tag 的 gitleaks / gitleaks-docker 两条都有）。
# 后果是 pre-commit 会把文件名追加到命令末尾，gitleaks 会把第一个文件名
# 当成仓库路径，报 "fatal: cannot change to ..." 后扫描 0 个提交，
# 却仍然输出 "no leaks found" 并以 0 退出——静默失效的假通过。
# 这里显式声明，行为可控且不依赖上游元数据。
#
# 手动扫描整个历史：
#   gitleaks git --redact --verbose

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (检测硬编码密钥)
        description: Detect hardcoded secrets using Gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
